[project]
name = "hound-core"
version = "0.1.0"
description = "Core matching engine for job posting and resume analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128.0,<0.129.0",
  "pypdf>=6.7.1,<7.0.0",
  "python-docx>=1.2.0,<2.0.0",
  "uvicorn>=0.40.0,<0.41.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
