name: Secret Scan

on:
  push:
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files
        run: bash scripts/secret_scan.sh repo

      - name: Scan git history for leaked keys
        run: bash scripts/secret_scan.sh history
